name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Compiler Verification
        run: npm run typecheck

      - name: ESLint Code Quality Verification
        run: npm run lint

      - name: Run Unit Test Suite (Offline)
        run: npm run test

      - name: Run AI Extraction Evaluation Suite (Offline)
        run: npm run evals

      - name: Production Next.js 16 Build (Offline)
        run: npm run build
